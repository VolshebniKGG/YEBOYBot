name: Core v2
on:
  push:
    branches: [feature/core-v2]
    paths: ['core_v2/**', 'tools/**', 'YEBOYBot.cmd', 'install_v2.bat', 'run.bat', 'run.py', 'requirements-legacy.txt', 'yeboybot/**', '.github/workflows/core-v2.yml']
  pull_request:
    paths: ['core_v2/**', 'tools/**', 'YEBOYBot.cmd', 'install_v2.bat', 'run.bat', 'run.py', 'requirements-legacy.txt', 'yeboybot/**', '.github/workflows/core-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core_v2/requirements*.txt
      - run: python -m pip install -r core_v2/requirements-dev.txt
      - name: Windows first and repeat installation
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call install_v2.bat
          if errorlevel 1 exit /b 1
          call install_v2.bat
          if errorlevel 1 exit /b 1
      - run: python -m pip check
      - run: python -m ruff check --config core_v2/ruff.toml core_v2 tools
      - name: Tests with retained output
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -u -X utf8 -m pytest core_v2/tests -vv --durations=10 -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-${{ matrix.os }}
          path: test-results/
          retention-days: 7
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yeboy
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: yeboy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://yeboy:test_only@localhost:5432/yeboy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r core_v2/requirements-dev.txt
      - name: PostgreSQL tests with retained output
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -u -X utf8 -m pytest core_v2/tests -vv --durations=10 -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres
          path: test-results/
          retention-days: 7

  legacy-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: First isolated legacy installation (no Discord login)
        run: python -I tools/legacy_launcher.py --install
      - name: Repeat installation without changing Core V2
        run: python -I tools/legacy_launcher.py --install
      - name: Import and isolation diagnostics
        run: python -I tools/legacy_launcher.py --check
      - name: Real legacy cogs in disposable source copy (offline)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            .venv-legacy/Scripts/python.exe -I tools/check_legacy_cogs.py
          else
            .venv-legacy/bin/python -I tools/check_legacy_cogs.py
          fi
      - name: Legacy regression tests in isolated environment
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            LEGACY_PY=.venv-legacy/Scripts/python.exe
          else
            LEGACY_PY=.venv-legacy/bin/python
          fi
          "$LEGACY_PY" -I -m pip --require-virtualenv install pytest==9.1.1 pytest-asyncio==1.4.0
          mkdir -p test-results
          set -o pipefail
          "$LEGACY_PY" -u -X utf8 -m pytest core_v2/tests/test_legacy_launcher.py core_v2/tests/test_legacy_bot.py -vv -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true --junitxml=test-results/legacy.xml 2>&1 | tee test-results/legacy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-${{ matrix.os }}
          path: test-results/
          retention-days: 7
