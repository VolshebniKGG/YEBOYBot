name: Core v2
on:
  push:
    branches: [feature/core-v2]
    paths: ['core_v2/**', 'tools/**', 'YEBOYBot.cmd', 'install_v2.bat', '.github/workflows/core-v2.yml']
  pull_request:
    paths: ['core_v2/**', 'tools/**', 'YEBOYBot.cmd', 'install_v2.bat', '.github/workflows/core-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core_v2/requirements*.txt
      - run: python -m pip install -r core_v2/requirements-dev.txt
      - name: Windows first and repeat installation
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call install_v2.bat
          if errorlevel 1 exit /b 1
          call install_v2.bat
          if errorlevel 1 exit /b 1
      - run: python -m pip check
      - run: python -m ruff check --config core_v2/ruff.toml core_v2 tools
      - run: python -m pytest core_v2/tests -vv --durations=10 -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: yeboy
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: yeboy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://yeboy:test_only@localhost:5432/yeboy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r core_v2/requirements-dev.txt
      - run: python -m pytest core_v2/tests -vv --durations=10 -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true

